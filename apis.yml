aid: tickerinside
name: TickerInside
description: TickerInside provides a free, open, machine‑readable JSON API of US ETF holdings. It serves each fund's holdings with weights, source
  dates, and links to securities, enabling programs and assistants to query ETF compositions without authentication. Data is sourced from issuer
  filings and SEC documents, offered under CC BY 4.0 (holdings history has separate terms).
