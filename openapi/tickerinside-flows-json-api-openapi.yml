        corporate_actions:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              date:
                type:
                - string
                description: The first close the funds show it on; funds that book it later show it a close or two after.
              kind:
                type: string
                enum:
                - converted
                - distribution
                - acquired_or_delisted
                - split
                - uniform_change
                description: 'converted (a merger paid in shares: from exited while to rose, or entered, by the same ratio in funds of three or more indexes), distribution (a spin-off: to entered at the same ratio of from in funds of three or more indexes), acquired_or_delisted (from left the funds of two or more issuers with nothing replacing it, and half its holders left it or its price per share stood still), split (three quarters or more of the funds holding from changed their counts by one ratio within three closes, while its price per share in the files moved by the inverse ratio: a split, a reverse split, a bonus issue or a stock dividend) or uniform_change (the same ratio with no price move to match: named and not ranked, its lines kept in the sums).'
              from:
                type:
                - string
                description: The security converted, the parent of a distribution, the security taken over or delisted, or the security split or changed.
              to:
                type:
                - string
                - 'null'
                description: 'The security received: from itself for a split; null for acquired_or_delisted and uniform_change.'
              ratio:
                type:
                - number
                - 'null'
                description: Shares of to per share of from, as the funds' counts show it (1.2 for a 6-for-5 bonus issue, 0.5 for a 1-for-2 reverse split); null for acquired_or_delisted.
              text:
                type:
                - string
                description: The action in words, to quote.
            required:
            - date
            - kind
            - from
            - to
            - ratio
            - text
          description: 'Mergers, spin-offs, takeovers, splits and uniform changes the files show in the last 20 trading days, newest first: no trades, so the lines a merger, a spin-off or a split moved are left out of the sums. Described below.'
        not_ranked:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              ticker:
                type:
                - string
                description: The security.
              reason:
                type: string
                enum:
                - fund_shares
                - converted
                - distribution
                - acquired_or_delisted
                - split
                - uniform_change
                description: converted, acquired_or_delisted, distribution, split, uniform_change or fund_shares.
            required:
            - ticker
            - reason
          description: 'The securities moved on date that the six lists leave out, each with its reason: converted (both securities of a merger paid in shares), acquired_or_delisted, distribution, split or uniform_change (within three closes of a corporate action, or on a close where a line of theirs is left out for one), or fund_shares (the shares of a fund the site covers, held by another fund).'
        funds_most_changed:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              fund:
                type:
                - string
                description: The fund's ticker.
              name:
                type:
                - string
                - 'null'
                description: Its name.
              previous:
                type:
                - string
                description: The date its issuer gives the file its step is compared with.
              date:
                type:
                - string
                description: The date its issuer gives its file, which can be a day after the close it reflects.
              entered:
                type:
                - integer
                description: Lines that entered.
              exited:
                type:
                - integer
                description: Lines that exited.
              increased:
                type:
                - integer
                description: Lines whose share count rose.
              decreased:
                type:
                - integer
                description: Lines whose share count fell.
              growth_pct:
                type:
                - number
                description: 'The fund''s own growth across the step, in percent: the median change of its share counts, mostly creations and redemptions of its shares.'
              not_trusted:
                type:
                - integer
                description: Lines left out of every sum, as no trade (see not_trusted in one security's flows).
            required:
            - fund
            - name
            - previous
            - date
            - entered
            - exited
            - increased
            - decreased
            - growth_pct
            - not_trusted
          description: The ten funds whose step to date entered or exited the most lines; described below.
        days:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              date:
                type:
                - string
                description: The close.
              funds:
                type:
                - integer
                description: How many funds have a counted step to it.
              complete:
                type:
                - boolean
                description: true when nine in ten of the funds counted on date do.
              securities_changed:
                type:
                - integer
                description: How many securities a fund moved on it.
              added_by_value:
                type: array
                items:
                  type: array
                  items:
                    type:
                    - string
                    - integer
                description: Its five largest net additions, as [ticker, dollars, shares].
              reduced_by_value:
                type: array
                items:
                  type: array
                  items:
                    type:
                    - string
                    - integer
                description: Its five largest net reductions.
            required:
            - date
            - funds
            - complete
            - securities_changed
            - added_by_value
            - reduced_by_value
          description: 'Each close of the last 20, newest first: how many funds have a step to it, whether nine in ten do (complete), how many securities moved, and its five largest net additions and reductions as [ticker, dollars, shares], the securities not ranked left out.'
        not_counted:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              fund:
                type:
                - string
                description: The fund's ticker.
              reason:
                type: string
                enum:
                - fund_of_funds
                - whole_fund_counts
                - not_daily
                - no_share_counts
                - no_longer_read
                - no_file_for_date
                - restated
                - no_previous_file
                - unreadable_file
                description: Why it is not counted on date.
              last_file:
                type:
                - string
                description: The date of its newest file.
              restated_reason:
                type:
                - string
                description: 'With restated: engine''s reason for the step, such as key_scheme_2.'
            required:
            - fund
            - reason
            - last_file
          description: 'The funds read daily that are not counted on date, each with its reason and its last file: fund_of_funds, whole_fund_counts (a file that counts every share class of a fund with mutual fund classes), no_share_counts, no_file_for_date, restated (a change of keys), no_previous_file or unreadable_file.'
        file_gaps:
          type:
          - integer
          description: How many lines the window leaves out because an issuer's file dropped them for a day and they came back with the same count.
        security:
          type:
          - string
          description: The address of one security's flows, with {ticker} to fill.
        csv:
          type:
          - string
          description: Every security moved on date, one row each, largest net value first.
        feed:
          type:
          - string
          description: This summary as an RSS feed, one item per complete close.
        feed_fund:
          type:
          - string
          description: One fund's holdings changes as an RSS feed, from its history, with {ticker} to fill.
        feed_stock:
          type:
          - string
          description: One security's flows as an RSS feed, with {ticker} to fill.
        note:
          type:
          - string
          description: How to read the figures.
        cite_as:
          type:
          - string
          description: 'A citation line: the close and this file''s address.'
        cite_html:
          type:
          - string
          description: 'The credit as HTML: a link to this file, then its address.'
        docs:
          type:
          - string
          description: Where the file is documented.
        license:
          type:
          - string
          description: 'The terms the flows are published under: TickerInside''s history terms, not CC BY 4.0, as they are computed from the archive.'
        terms:
          type:
          - string
          description: The terms in full, on the legal notice.
        attribution:
          type:
          - string
          description: How to credit it, then what the history terms allow.
      required:
      - date
      - newest_file
      - first_date
      - method
      - coverage
      - added_by_value
      - reduced_by_value
      - added_by_shares_pct
      - reduced_by_shares_pct
      - added_beyond_growth_by_value
      - reduced_beyond_growth_by_value
      - index_events
      - corporate_actions
      - not_ranked
      - funds_most_changed
      - days
      - not_counted
      - file_gaps
      - security
      - csv
      - feed
      - feed_fund
      - feed_stock
      - note
      - cite_as
      - cite_html
      - docs
      - license
      - terms
      - attribution
    Unavailable:
      type: object
      additionalProperties: true
      required:
      - error
      - message
      - status
      - uptime
      properties:
        error:
          type: string
          const: unavailable
        message:
          type: string
        status:
          type: string
          description: The nightly report.
        uptime:
          type: string
          description: 'The live checks: whether the site fails its own checks.'
