components:
  schemas:
    FlowsSummary:
      type: object
      additionalProperties: true
      properties:
        date:
          type:
          - string
          - 'null'
          description: 'The market close of the figures: the newest close that nine in ten of the funds counted have a file of. Each file is placed at the close it reflects (Invesco dates a Friday''s file on the Saturday, Vanguard''s ETF files carry the next business day), and each fund''s change runs from its previous file to its file of this close.'
        newest_file:
          type:
          - string
          - 'null'
          description: The newest close a file read reflects. A close is published once every fund still publishing has a file of it or of a later close, so date can be older.
        first_date:
          type:
          - string
          - 'null'
          description: 'The first close with a counted change: the first files carrying share counts in today''s keys.'
        method:
          type:
          - string
          description: The method of the figures, ti-flows/1.
        coverage:
          type: object
          additionalProperties: true
          properties:
            funds_read_daily:
              type:
              - integer
              description: The funds read from their issuers' files every business day.
            funds_counted:
              type:
              - integer
              description: How many of them have a step to date that is counted.
            issuers:
              type: array
              items:
                type: string
              description: The issuers of the funds counted.
            net_assets_usd:
              type:
              - integer
              - 'null'
              description: The counted funds' net assets, as their issuers' files state them.
            share_of_stock_etf_assets_pct:
              type:
              - number
              - 'null'
              description: The counted funds' share of the assets of the covered US stock ETFs, measured as the universe's share of assets is; null when not measured.
            not_counted:
              type: object
              additionalProperties:
                type: integer
              description: How many funds of the archive are not counted, by reason, not_daily for a fund whose issuer publishes monthly.
          required:
          - funds_read_daily
          - funds_counted
          - issuers
          - net_assets_usd
          - share_of_stock_etf_assets_pct
          - not_counted
          description: Which funds are counted; its fields are described below.
        added_by_value:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              ticker:
                type:
                - string
                description: 'The security''s key: a US ticker, or a local code and market for a line listed abroad (7203.JP).'
              name:
                type:
                - string
                - 'null'
                description: Its name, where known.
              funds_adding:
                type:
                - integer
                description: How many funds hold more shares of it than in their previous file.
              funds_trimming:
                type:
                - integer
                description: How many hold fewer.
              funds_entered:
                type:
                - integer
                description: How many of those adding did not hold it before.
              funds_exited:
                type:
                - integer
                description: How many of those trimming hold none now.
              net_shares:
                type:
                - integer
                - 'null'
                description: 'The change in shares held, summed over the funds. Null when fewer than three funds moved it or one fund makes more than 80% of it, as withheld says: a fund''s share count is never published.'
              net_shares_pct:
                type:
                - number
                - 'null'
                description: net_shares in percent of the shares the funds held before; null when fewer than three funds held it before or after, or one fund held more than 80% of it.
              net_shares_beyond_growth:
                type:
                - integer
                - 'null'
                description: The same change less the part in proportion to each fund's own growth across its step (b minus k times a, k the fund's median ratio of share counts).
              net_value_usd:
                type:
                - integer
                - 'null'
                description: 'net_shares valued at each file''s own price per share: market value over shares, or weight times the fund''s stated net assets over shares. Never an outside price.'
              net_value_beyond_growth_usd:
                type:
                - integer
                - 'null'
                description: net_shares_beyond_growth valued the same way.
              withheld:
                type:
                - object
                - 'null'
                additionalProperties:
                  type: string
                  enum:
                  - fewer_than_3_funds
                  - one_fund_dominant
                  - gives_back_a_fund_count
                  - not_all_valued
                description: 'Why each null sum is null, as {field: reason}, or null: fewer_than_3_funds, one_fund_dominant (one fund makes more than 80% of the sum, or of the difference two published sums give, such as net_shares less net_shares_beyond_growth), gives_back_a_fund_count (the sums as printed, taken as one or two funds'' own or compared with the figures published before for the same close, would give back a fund''s share count) or not_all_valued.'
            required:
            - ticker
            - name
            - funds_adding
            - funds_trimming
            - funds_entered
            - funds_exited
            - net_shares
            - net_shares_pct
            - net_shares_beyond_growth
            - net_value_usd
            - net_value_beyond_growth_usd
            - withheld
          description: The ten securities with the largest net additions in dollars on date, the securities in not_ranked left out; a row is described below.
        reduced_by_value:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              ticker:
                type:
                - string
                description: 'The security''s key: a US ticker, or a local code and market for a line listed abroad (7203.JP).'
              name:
                type:
                - string
                - 'null'
                description: Its name, where known.
              funds_adding:
                type:
                - integer
                description: How many funds hold more shares of it than in their previous file.
              funds_trimming:
                type:
                - integer
                description: How many hold fewer.
              funds_entered:
                type:
                - integer
                description: How many of those adding did not hold it before.
              funds_exited:
                type:
                - integer
                description: How many of those trimming hold none now.
              net_shares:
                type:
                - integer
                - 'null'
                description: 'The change in shares held, summed over the funds. Null when fewer than three funds moved it or one fund makes more than 80% of it, as withheld says: a fund''s share count is never published.'
              net_shares_pct:
                type:
                - number
                - 'null'
                description: net_shares in percent of the shares the funds held before; null when fewer than three funds held it before or after, or one fund held more than 80% of it.
              net_shares_beyond_growth:
                type:
                - integer
                - 'null'
                description: The same change less the part in proportion to each fund's own growth across its step (b minus k times a, k the fund's median ratio of share counts).
              net_value_usd:
                type:
                - integer
                - 'null'
                description: 'net_shares valued at each file''s own price per share: market value over shares, or weight times the fund''s stated net assets over shares. Never an outside price.'
              net_value_beyond_growth_usd:
                type:
                - integer
                - 'null'
                description: net_shares_beyond_growth valued the same way.
              withheld:
                type:
                - object
                - 'null'
                additionalProperties:
                  type: string
                  enum:
                  - fewer_than_3_funds
                  - one_fund_dominant
                  - gives_back_a_fund_count
                  - not_all_valued
