openapi: 3.2.0
info:
  title: TickerInside Diversify API
  version: '1'
  summary: Holdings of 5,433 US ETFs, which ETFs hold a stock, and overlap, as static JSON.
  description: TickerInside is an open, machine-readable database of US ETF holdings, with the source and date of each holding.
  termsOfService: https://tickerinside.com/terms/
  contact:
    name: TickerInside
    email: contact@tickerinside.com
    url: https://tickerinside.com/api/
  license:
    name: CC BY 4.0
    identifier: CC-BY-4.0
servers:
- url: https://tickerinside.com/api/v1
  description: Static JSON files, and five answers computed from them when asked. No key.
security: []
tags:
- name: Diversify
paths:
  /diversify:
    get:
      operationId: getDiversify
      summary: Does it diversify me?, computed
      description: 'With have alone (Find, mode find): the large US ETFs of a published list ranked by the correlation of their weekly returns with the portfolio''s, one per group first, each with its figures and dates. For each fund of try, against the portfolio of the funds of have: its overlap by weight, the correlation of weekly returns on all weeks and on the weeks the portfolio fell, its part in mega-cap tech, its sectors and countries, and a sentence to quote, ranked. 1 to 6 funds in have and 1 to 6 in try. The files read weigh at most 90 KB, a compact file for half its size and a file of the other layers for a third, and hold at most 20,000 lines between them; each fund to try is compared with each fund held in at most 16,000 comparisons of lines in all, about the lines of the shorter of each pair. With have alone, Find ranks the list for any portfolio of up to 6 funds with weekly returns; the overlap of its 3 runs when the files of both sides fit the lower limits of Find, and overlap says whether it ran.'
      externalDocs:
        url: https://tickerinside.com/api/#diversify
      parameters:
      - name: have
        in: query
        required: true
        description: The funds held, separated by commas, each with its weight after a colon, or none for equal weights; a weight for every fund or for none.
        schema:
          type: string
        example: QQQ:60,SMH:20,GLD:20
      - name: try
        in: query
        required: false
        description: The funds to try, separated by commas, none of them in have. Without it, Find.
        schema:
          type: string
        example: VXUS,SPMO
      - name: format
        in: query
        required: false
        description: 'json only: diversify has no CSV twin; its page is /diversify/ with the same query.'
        schema:
          type: string
          enum:
          - json
      responses:
        '200':
          description: The answer, computed when asked and kept in the edge cache for up to a day. The example is a real answer, shortened.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Diversify'
                - $ref: '#/components/schemas/DiversifyFind'
              example:
                kind: diversify
                mode: compare
                question: Does VXUS or SPMO diversify a portfolio of QQQ 60%, SMH 20% and GLD 20%?
                answer: Of VXUS and SPMO, VXUS has the lowest overlap with QQQ 60%, SMH 20% and GLD 20%, 0.6% by weight in the issuer files and Form N-PORT filings of 2026-06-30 to 2026-10-10, and the lowest weekly correlation with them, 0.75 over 156 weeks to 2026-10-09.
                answers:
                - VXUS has an overlap of 0.6% by weight with a portfolio of QQQ 60%, SMH 20% and GLD 20%, by the issuer files of 2026-08-31 for VXUS and 2026-10-10 for QQQ, and the Form N-PORT filing of 2026-06-30 for SMH; its weekly returns had a 0.75 correlation over 156 weeks to 2026-10-09, and 0.65 over the 57 weeks the portfolio fell.
                - SPMO has an overlap of 30.6% by weight with a portfolio of QQQ 60%, SMH 20% and GLD 20%, by the issuer files of 2026-10-10 for QQQ and SPMO, and the Form N-PORT filing of 2026-06-30 for SMH; its weekly returns had a 0.91 correlation over 156 weeks to 2026-10-09, and 0.83 over the 57 weeks the portfolio fell.
                have:
                  funds:
                  - ticker: QQQ
                    weight_pct: 60
                    name: Invesco QQQ Trust
                    holdings_as_of: '2026-10-10'
                    holdings_source: issuer file
                    holds_shares: true
                    weekly_returns: 156
                  - ticker: SMH
                    weight_pct: 20
                    name: VanEck Semiconductor ETF
                    holdings_as_of: '2026-06-30'
                    holdings_source: SEC Form N-PORT
                    holds_shares: true
                    weekly_returns: 156
                  - ticker: GLD
                    weight_pct: 20
                    name: SPDR Gold Shares
                    holdings_as_of: '2026-06-30'
                    holdings_source: trust's own SEC filing
                    holds_shares: false
                    weekly_returns: 156
                  weights: given
                  looked_through_pct: 80
                  holds_no_shares:
                  - GLD
                  returns_from:
                  - QQQ
                  - SMH
                  - GLD
                  mega_cap_tech_pct: 28.8
                  sectors:
                    known_pct: 79.9
                    coverage_pct: 100
                    stated: true
                    weights:
                    - sector: technology
                      name: technology
                      pct: 55.5
                    - sector: communication_services
                      name: communication services
                      pct: 8.8
                    - sector: consumer_discretionary
                      name: consumer discretionary
                      pct: 6.2
                  countries:
                    us_pct: 74.5
                    weights:
                    - country: US
                      name: United States
                      pct: 74.5
                    - country: NL
                      name: Netherlands
                      pct: 2
                    - country: TW
                      name: Taiwan
                      pct: 1.9
                    other_pct: 0.1
                  sentence: A portfolio of QQQ 60%, SMH 20% and GLD 20% puts 28.8% of the portfolio in mega-cap tech. Its largest sector is technology at 55.5%, with a sector found for 100.0% of its stock weight.
                candidates:
                - ticker: VXUS
                  name: Vanguard Total International Stock ETF
                  holdings_as_of: '2026-08-31'
                  holdings_source: issuer file
                  fund_file: https://tickerinside.com/api/v1/fund/vxus.json
                  page_url: https://tickerinside.com/etf/vxus/
                  overlap:
                    by_weight_pct: 0.6
                    share_of_candidate_pct: 0.6
                    companies_in_both: 4
                    largest_shared:
                    - ticker: SHOP
                      in_candidate_pct: 0.4
                      in_have_pct: 0.51
                      counted_pct: 0.4
                    - ticker: PDD
                      in_candidate_pct: 0.14
                      in_have_pct: 0.13
                      counted_pct: 0.13
                    - ticker: CCEP
                      in_candidate_pct: 0.05
                      in_have_pct: 0.11
                      counted_pct: 0.05
                  correlation:
                    weekly: 0.75
                    weeks: 156
                    from: '2023-10-20'
                    to: '2026-10-09'
                    down_weeks: 0.65
                    down_weeks_count: 57
                    with:
                    - QQQ
                    - SMH
                    - GLD
                  volatility_pct: 14.5
                  with_10_pct:
                    volatility_pct: 18
                    instead_of_pct: 18.8
                    weeks: 156
                    to: '2026-10-09'
                  mega_cap_tech_pct: 0
                  sectors:
                    known_pct: 74.2
                    coverage_pct: 74.6
                    stated: true
                    weights:
                    - sector: financials
                      name: financials
                      pct: 17.5
                    - sector: technology
                      name: technology
                      pct: 15
                    - sector: industrials
                      name: industrials
                      pct: 10.2
                  countries:
                    us_pct: 0.1
                    weights:
                    - country: JP
                      name: Japan
                      pct: 15.5
                    - country: TW
                      name: Taiwan
                      pct: 8.7
                    - country: GB
                      name: United Kingdom
                      pct: 8.2
                    other_pct: 46.2
                  rank: 1
                  sentence: VXUS has an overlap of 0.6% by weight with a portfolio of QQQ 60%, SMH 20% and GLD 20%, by the issuer files of 2026-08-31 for VXUS and 2026-10-10 for QQQ, and the Form N-PORT filing of 2026-06-30 for SMH; its weekly returns had a 0.75 correlation over 156 weeks to 2026-10-09, and 0.65 over the 57 weeks the portfolio fell.
                - ticker: SPMO
                  name: Invesco S&P 500 Momentum ETF
                  holdings_as_of: '2026-10-10'
                  holdings_source: issuer file
                  fund_file: https://tickerinside.com/api/v1/fund/spmo.json
                  page_url: https://tickerinside.com/etf/spmo/
                  overlap:
                    by_weight_pct: 30.6
                    share_of_candidate_pct: 60.4
                    companies_in_both: 23
                    largest_shared:
                    - ticker: AAPL
                      in_candidate_pct: 9.11
                      in_have_pct: 4.4
                      counted_pct: 4.4
                    - ticker: MU
                      in_candidate_pct: 9.2
                      in_have_pct: 4.01
                      counted_pct: 4.01
                    - ticker: AMD
                      in_candidate_pct: 5.61
                      in_have_pct: 3.58
                      counted_pct: 3.58
                  correlation:
                    weekly: 0.91
                    weeks: 156
                    from: '2023-10-20'
                    to: '2026-10-09'
                    down_weeks: 0.83
                    down_weeks_count: 57
                    with:
                    - QQQ
                    - SMH
                    - GLD
                  volatility_pct: 20.5
                  with_10_pct:
                    volatility_pct: 18.8
                    instead_of_pct: 18.8
                    weeks: 156
                    to: '2026-10-09'
                  mega_cap_tech_pct: 18
                  sectors:
                    known_pct: 100
                    coverage_pct: 100
                    stated: true
                    weights:
                    - sector: technology
                      name: technology
                      pct: 53.8
                    - sector: health_care
                      name: health care
                      pct: 10.4
                    - sector: communication_services
                      name: communication services
                      pct: 8.9
                  countries:
                    us_pct: 100
                    weights:
                    - country: US
                      name: United States
                      pct: 100
                    other_pct: 0
                  rank: 2
                  sentence: SPMO has an overlap of 30.6% by weight with a portfolio of QQQ 60%, SMH 20% and GLD 20%, by the issuer files of 2026-10-10 for QQQ and SPMO, and the Form N-PORT filing of 2026-06-30 for SMH; its weekly returns had a 0.91 correlation over 156 weeks to 2026-10-09, and 0.83 over the 57 weeks the portfolio fell.
                ranking: By overlap, lowest first, then by weekly correlation, lowest first, each as printed (one and two decimals). An ETF with a figure not measured comes after those measured, then in the order asked. Two measurements, not a recommendation.
                prices_as_of: '2026-10-09'
                definitions:
                  overlap: 'The sum, over the companies both hold, of the smaller of two weights: the company''s weight in the candidate, and its weight in the portfolio, which is its weight in each of the portfolio''s ETFs times that ETF''s weight. An ETF that holds no shares adds nothing to the portfolio''s side. For an ETF read from its SEC filings, a holding the filing lists on a market abroad matches only the same holding abroad.'
                  share_of_candidate: The part of the candidate's weight in companies the portfolio also holds, each counted at the candidate's own weight. It is never below the overlap, which counts the smaller of the two weights.
                  correlation: 'Pearson''s correlation between the candidate''s weekly returns and the portfolio''s, on the weeks both have: at most the 156 the files carry, at least 52. The portfolio''s weekly return is the return of its ETFs at their weights, counting every ETF with at least 52 weekly returns here, whatever it holds. A weekly return is a weekly total return, from the last close of one week to the last close of the next, with dividends reinvested, as in the fund files. The weeks end on Fridays, or on the Thursday when the exchange is shut that Friday, and the last one ends on the files'' last close.'
                  down_weeks: The same correlation on the weeks the portfolio's return was below zero, when there are at least 20.
                  mega_cap_tech:
                    rule: 'A fixed list, the one every fund file''s breakdown and every ETF page count: Apple, Microsoft, Nvidia, Alphabet, Amazon, Meta Platforms, Broadcom and Tesla, every listed class of each.'
                    companies:
                    - name: Apple
                      tickers:
                      - AAPL
                    - name: Microsoft
                      tickers:
                      - MSFT
                    - name: Nvidia
                      tickers:
                      - NVDA
                  sectors: Each ETF's breakdown, as its fund file and ETF page give it. A company's sector is the one most of the single-sector index funds that hold it belong to, each fund one vote, or else the sector of its SEC industry code. When a sector is found for under 50% of an ETF's stock weight, no sector weight is given. A portfolio's breakdown is its ETFs' at their weights.
                  sectors_stated_from_pct: 50
                  countries: 'Each ETF''s breakdown, as its fund file gives it. A line listed abroad counts under the country of its market. A US-listed line counts under the United States, unless its company files with the SEC as a foreign issuer or is Canadian: it then counts under the country of the company''s business address. A fund held by a fund counts under the United States.'
                share_url: https://tickerinside.com/diversify/?have=QQQ:60,SMH:20,GLD:20&try=VXUS,SPMO
                api_url: https://tickerinside.com/api/v1/diversify?have=QQQ:60,SMH:20,GLD:20&try=VXUS,SPMO
                source:
                  provider: TickerInside
                  links:
                  - ticker: QQQ
                    page_url: https://tickerinside.com/etf/qqq/
                    api_url: https://tickerinside.com/api/v1/fund/qqq.json
                    holdings_source: issuer file
                  - ticker: SMH
                    page_url: https://tickerinside.com/etf/smh/
                    api_url: https://tickerinside.com/api/v1/fund/smh.json
                    holdings_source: SEC Form N-PORT
                  - ticker: GLD
                    page_url: https://tickerinside.com/etf/gld/
                    api_url: https://tickerinside.com/api/v1/etf/gld.json
                    holdings_source: trust's own SEC filing
                  reference_url: https://tickerinside.com/api/v1/diversify/reference.json
                  license: CC BY 4.0
                  cite_as: TickerInside (tickerinside.com), Does it diversify me?, https://tickerinside.com/diversify/?have=QQQ:60,SMH:20,GLD:20&try=VXUS,SPMO, from the ETFs' holdings files and weekly prices, dated as shown.
                note: Measurement, not investment advice.
                license: CC BY 4.0
                attribution: Credit TickerInside with a link to the page of a fund the figure comes from (source names them), or to this address, wherever the medium allows a link, and by name where it does not. How you mark the link is up to you.
                docs: https://tickerinside.com/api/#diversify
        '304':
          description: 'Not modified: the ETag of your copy, sent in If-None-Match, is still current.'
        '400':
          description: 'The query was refused: reason and parameter say what to fix, and limit and asked give the figures of a call past the limits.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
              example:
                error: bad_request
                reason: too_few_funds
                message: funds must name at least 2 different funds.
                parameter: funds
                min: 2
                docs: https://tickerinside.com/api/#overlap
        '404':
          description: 'A fund the answer needs is not covered: not_covered lists the tickers, with the reason in message, and reason has_security_file the stock file of one that has one (security).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotCovered'
        '405':
          description: Another method than GET or HEAD.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    const: method_not_allowed
                  message:
                    type: string
                  docs:
                    type: string
        '503':
          description: 'The answer could not be computed just then: retry after a minute.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unavailable'
      tags:
      - Diversify
  /diversify/candidates.json:
    get:
      operationId: getDiversifyList
      summary: The list Find ranks
      description: 'The files Find reads, public like every file under /api/v1/. candidates.json is the list: its date, its groups, its rule in words, and each ETF of it with its weekly returns, its breakdown or what it holds, and what its file counts for against the limits of an answer. /api/v1/diversify/weekly/{ticker}.json, in lower case, is one ETF''s weekly returns and breakdown, for every ETF with at least 52 weekly returns whose last week is the list''s, with its own ranking against the list. An answer of have alone is a sort of these measurements by the published rule, the same list for every portfolio: a ranking can be recomputed from these files alone, as Pearson''s correlation of w against the portfolio''s weekly returns at its weights.'
      externalDocs:
        url: https://tickerinside.com/api/#diversify
      responses:
