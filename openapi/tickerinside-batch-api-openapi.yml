openapi: 3.2.0
info:
  title: TickerInside Batch API
  version: '1'
  summary: Holdings of 5,433 US ETFs, which ETFs hold a stock, and overlap, as static JSON.
  description: TickerInside is an open, machine-readable database of US ETF holdings, with the source and date of each holding.
  termsOfService: https://tickerinside.com/terms/
  contact:
    name: TickerInside
    email: contact@tickerinside.com
    url: https://tickerinside.com/api/
  license:
    name: CC BY 4.0
    identifier: CC-BY-4.0
servers:
- url: https://tickerinside.com/api/v1
  description: Static JSON files, and five answers computed from them when asked. No key.
security: []
tags:
- name: Batch
paths:
  /batch:
    get:
      operationId: getBatch
      summary: Several fund files, computed
      description: Each fund as /fund/{ticker}.json answers it, keyed by ticker, with the tickers not covered and why. 1 to 10 funds. The files of the other layers composed in one call add up to at most 55 KB; the first is always composed.
      externalDocs:
        url: https://tickerinside.com/api/#batch
      parameters:
      - name: funds
        in: query
        required: true
        description: Tickers separated by commas, 1 to 10; case does not matter and a ticker given twice counts once.
        schema:
          type: string
        example: VOO,QQQ
      - name: format
        in: query
        required: false
        description: 'json only: batch has no CSV twin.'
        schema:
          type: string
          enum:
          - json
      responses:
        '200':
          description: The answer, computed when asked and kept in the edge cache for up to a day. The example is a real answer, shortened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              example:
                asked:
                - VOO
                - QQQ
                - NVDA
                found: 2
                not_covered:
                - error: not_covered
                  reason: has_security_file
                  ticker: NVDA
                  message: 'NVDA is not a fund we cover, but it has a security file: /api/v1/sec/nvda.json lists the covered funds that hold it, if any, with the weight and the date of each file.'
                  security: https://tickerinside.com/api/v1/sec/nvda.json
                funds:
