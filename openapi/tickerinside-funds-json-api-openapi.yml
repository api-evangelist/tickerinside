components:
  schemas:
    Funds:
      type: object
      properties:
        as_of:
          type:
          - string
          - 'null'
          description: The price date.
        count:
          type:
          - integer
          - 'null'
          description: How many issuer-layer funds there are, the length of funds. Each has a /fund/ file.
        with_a_page:
          type:
          - integer
          - 'null'
          description: How many funds have a page, in every list of this file.
        note:
          type:
          - string
          - 'null'
          description: How to read the entries.
        funds:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              t:
                type:
                - string
                - 'null'
              n:
                type:
                - string
                - 'null'
              c:
                type:
                - string
                - 'null'
              cat_id:
                type:
                - string
                - 'null'
              er:
                type:
                - number
                - 'null'
              p:
                type:
                - integer
                - 'null'
              issuer:
                type:
                - string
                - 'null'
              aum_b:
                type:
                - number
                - 'null'
              page:
                type:
                - boolean
                - 'null'
              url:
                type:
                - string
                - 'null'
              api:
                type:
                - string
                - 'null'
            additionalProperties: true
          description: 'One entry per issuer-layer fund: t the ticker, n the name, c the category''s name (Large Blend for US Large Blend, as before 9 October 2026), cat_id its id, er the expense ratio, p the number of positions. issuer is the fund''s issuer, named as in index.json coverage.issuers, and aum_b its assets in billions of US dollars, as in its fund file; either can be null. page says whether it has a page, url is that page or null, and api is its file.'
        sec_count:
          type:
          - integer
          - 'null'
          description: How many SEC-layer funds there are, the length of sec_funds.
        sec_note:
          type:
          - string
          - 'null'
          description: How to read sec_funds.
        sec_funds:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              t:
                type:
                - string
                - 'null'
              n:
                type:
                - string
                - 'null'
              c:
                type:
                - string
                - 'null'
              cat_id:
                type:
                - string
                - 'null'
              er:
                type:
                - number
                - 'null'
              p:
                type:
                - integer
                - 'null'
              api:
                type:
                - string
                - 'null'
              report_date:
                type:
                - string
                - 'null'
              issuer:
                type:
                - string
                - 'null'
              aum_b:
                type:
                - number
                - 'null'
              net_assets:
                type:
                - number
                - 'null'
              page:
                type:
                - boolean
                - 'null'
              url:
                type:
                - string
                - 'null'
            additionalProperties: true
          description: 'One entry per SEC-layer fund: t, n, c, cat_id, er, p, issuer, aum_b and api as above, then report_date, the quarter end the filing describes, and net_assets, in US dollars on that date. er is null where the cost is not in the data, never zero, and aum_b is null unless the market data gives the fund''s size; the filing''s figure is net_assets. issuer is read from the fund''s name and checked against the trust that filed it, or null when neither says. page and url as in funds.'
        sponsor_funds:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              t:
                type:
                - string
                - 'null'
              n:
                type:
                - string
                - 'null'
              c:
                type:
                - string
                - 'null'
              cat_id:
                type:
                - string
                - 'null'
              er:
                type:
                - number
                - 'null'
              p:
                type:
                - number
                - 'null'
              api:
                type:
                - string
                - 'null'
              report_date:
                type:
                - string
                - 'null'
              issuer:
                type:
                - string
                - 'null'
              aum_b: {}
              net_assets:
                type:
                - number
                - 'null'
            additionalProperties: true
          description: One entry per sponsor-file fund, as sec_funds.
        prospectus_funds:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              t:
                type:
                - string
                - 'null'
              n:
                type:
                - string
                - 'null'
              c:
                type:
                - string
                - 'null'
              cat_id:
                type:
                - string
                - 'null'
              er:
                type:
                - number
                - 'null'
              p:
