                - 'null'
              form:
                type:
                - string
                - 'null'
              issuer: {}
              aum_b: {}
            additionalProperties: true
          description: One entry per prospectus-file fund, as sec_funds, with filed and form.
        bond_funds:
          type:
          - array
          - 'null'
          items:
            type: object
