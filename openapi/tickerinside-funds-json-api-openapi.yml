              net_assets:
                type:
                - number
                - 'null'
            additionalProperties: true
          description: One entry per multi-asset fund, as sec_funds.
        derivative_funds:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              t:
                type:
                - string
                - 'null'
              n:
                type:
                - string
                - 'null'
              c:
                type:
                - string
                - 'null'
              cat_id:
                type:
                - string
                - 'null'
              er:
                type:
                - number
                - 'null'
              p:
                type:
                - number
                - 'null'
              api:
                type:
                - string
                - 'null'
              report_date:
                type:
                - string
                - 'null'
              issuer: {}
              aum_b: {}
              net_assets:
                type:
                - number
                - 'null'
            additionalProperties: true
          description: One entry per derivative-based fund, as sec_funds; report_date is the quarter end its filing describes. The files of this and the next three lists are under /etf/, at each entry's api. In them, page and url are given only for a fund that has a page.
        trust_funds:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              t:
                type:
                - string
                - 'null'
              n:
                type:
                - string
                - 'null'
              c:
                type:
                - string
                - 'null'
              cat_id:
                type:
                - string
                - 'null'
              er:
                type:
                - number
                - 'null'
              p:
                type:
                - number
                - 'null'
              api:
                type:
                - string
                - 'null'
              report_date:
                type:
                - string
                - 'null'
              issuer:
                type:
                - string
                - 'null'
              aum_b:
                type:
                - number
                - 'null'
              net_assets: {}
            additionalProperties: true
          description: One entry per trust or commodity pool, as sec_funds; report_date is the period its filing describes, null for a fund too new to have filed a report.
        license:
          type:
          - string
          - 'null'
          description: The licence the data is published under.
        attribution:
          type:
          - string
          - 'null'
          description: 'How to credit the data: a link to this file where the medium allows one, the name where it does not.'
      additionalProperties: true
      required:
      - as_of
