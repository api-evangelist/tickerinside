              report_date:
                type:
                - string
                - 'null'
              issuer: {}
              aum_b: {}
              net_assets:
                type:
                - number
                - 'null'
            additionalProperties: true
          description: One entry per fixed income fund, as sec_funds; p counts its filing's lines.
        multi_asset_funds:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              t:
                type:
                - string
                - 'null'
              n:
                type:
                - string
                - 'null'
              c:
                type:
                - string
                - 'null'
              cat_id:
                type:
                - string
                - 'null'
              er:
                type:
                - number
                - 'null'
              p:
                type:
                - number
                - 'null'
              api:
                type:
                - string
                - 'null'
              report_date:
                type:
                - string
                - 'null'
              issuer:
                type:
