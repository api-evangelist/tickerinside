components:
  schemas:
    Manifest:
      type: object
      properties:
        manifest_version:
          type:
          - number
          - 'null'
          description: 'The version of this file''s own shape: 1. A field added keeps it.'
        built_at:
          type:
          - string
          - 'null'
          description: When the build that wrote every file listed here ran, in UTC. Give it beside a figure to cite the exact state it comes from.
        build_date:
          type:
          - string
          - 'null'
          description: The day of built_at.
        schema:
          type: object
          properties:
            api:
              type:
              - string
              - 'null'
              description: 'The version in the path: v1. Inside it, fields are added, never removed or retyped.'
            digest:
              type:
              - string
              - 'null'
              description: 'The sha256 of the tables the API reference and the OpenAPI description are written from: the names of the fields and codes and the types they fix, without their words. It is read from the code, never from a night''s files, so the night''s data never moves it; a field, a code or a type added to those tables does.'
            openapi:
              type:
              - string
              - 'null'
              description: The OpenAPI description.
          additionalProperties: true
          required:
          - api
          - digest
          - openapi
          description: The version of the API's shape; its fields are described below.
        calculation:
          type: object
          properties:
            version:
              type:
              - string
              - 'null'
              description: 'The first 16 hexadecimal characters of the sha256 of the method ids and the versions under readers: it moves when any of them does, and on no other night.'
            methods:
              type:
              - array
              - 'null'
              items:
                type: object
                properties:
                  id:
                    type:
                    - string
                    - 'null'
                  since:
                    type:
                    - string
                    - 'null'
                additionalProperties: true
              description: Each method of methods.json, as id and since, the first day figures were published under it.
            readers:
              type: object
              additionalProperties:
                type:
                - integer
                - 'null'
              description: 'The version of each reader and computation named here, by name: it rises when what it makes of the same input changes, and for issuer_file_read, price_read, returns_and_risk and computed_answers with any change to their code. key_scheme is how securities are keyed (2: a line abroad carries its market). Code not named here moves no version: a figure it corrects is recorded in corrections.json.'
          additionalProperties: true
          required:
          - version
          - methods
          - readers
          description: The version of the calculations; its fields are described below.
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type:
                - string
                - 'null'
                description: 'The source: prices, a layer of fund files by its source_layer (issuer, sec_nport and the others), or directory, Nasdaq Trader''s symbol directory.'
              name:
                type:
                - string
                - 'null'
                description: The source in words.
              version:
                type:
                - string
                - 'null'
                description: 'The source''s own version where it has one: the SEC''s quarterly data set read (2026q2) for sec_nport, the file''s date for the directory; null otherwise.'
              date:
                type:
                - string
                - 'null'
                description: 'The date of the data: the last close for prices, the newest holdings date of the layer''s fund files, the directory''s file date.'
              age_days:
                type:
                - integer
                - 'null'
                description: Days from date to the day of the build.
              oldest:
                type:
                - string
                - 'null'
                description: The oldest holdings date of the layer's fund files; null for prices and the directory.
              oldest_age_days:
                type:
                - integer
                - 'null'
                description: Days from oldest to the day of the build.
              median_age_days:
                type:
                - integer
                - 'null'
                description: The median, over the layer's fund files, of the days from their holdings date to the day of the build.
              funds:
                type:
                - integer
                - 'null'
                description: How many fund files of the layer; null for prices and the directory.
            additionalProperties: true
            required:
            - id
            - name
            - version
            - date
            - age_days
            - oldest
            - oldest_age_days
            - median_age_days
            - funds
          description: Each source of the data with its version, date and age in days on the day of the build; their fields are described below.
        files:
          type: object
          properties:
            count:
              type:
              - number
              - 'null'
              description: 'How many files are listed: every file under /api/v1/ but this one and the list.'
            bytes:
              type:
              - number
              - 'null'
              description: Their size, added up.
            list:
              type:
              - string
              - 'null'
              description: 'The list, gzipped: /api/v1/sha256sums.txt.gz.'
            list_sha256:
              type:
              - string
              - 'null'
              description: The sha256 of the list once unzipped.
            format:
              type:
              - string
              - 'null'
              description: How the list is written, and the command that checks a copy against it.
          additionalProperties: true
          required:
          - count
          - bytes
          - list
          - list_sha256
          - format
          description: The list of every file with its sha256; its fields are described below.
        families:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
            required:
            - files
            - bytes
            - sha256
            properties:
              files:
                type: integer
              bytes:
                type: integer
              sha256:
                type: string
                pattern: ^[0-9a-f]{64}$
          description: 'One entry per family of files, keyed by a directory followed by a slash (fund/) or by the name of a file at the top (index.json): files, the number of files, bytes, their size, and sha256, the digest of the family''s lines of the list, in their order, each ending with a newline.'
        methods_url:
          type:
          - string
          - 'null'
          description: The methods of the computed figures, /api/v1/methods.json.
        contract:
          type:
          - string
          - 'null'
          description: 'The data contract this file belongs to: /contract/.'
        docs:
          type:
          - string
          - 'null'
          description: Where this file is documented.
        license:
          type:
          - string
          - 'null'
          description: The licence the file is published under.
        attribution:
          type:
          - string
          - 'null'
          description: 'How to credit the data: a link to this file where the medium allows one, the name where it does not.'
      additionalProperties: true
      required:
      - manifest_version
      - built_at
      - build_date
      - schema
      - calculation
      - sources
      - files
      - families
      - methods_url
      - contract
      - docs
      - license
      - attribution
    Unavailable:
      type: object
      additionalProperties: true
      required:
      - error
      - message
      - status
      - uptime
      properties:
        error:
          type: string
          const: unavailable
        message:
          type: string
        status:
          type: string
          description: The nightly report.
        uptime:
          type: string
          description: 'The live checks: whether the site fails its own checks.'
externalDocs:
  description: The reference, with examples and recipes
  url: https://tickerinside.com/api/
