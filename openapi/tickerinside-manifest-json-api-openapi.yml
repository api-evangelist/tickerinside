openapi: 3.2.0
info:
  title: TickerInside Manifest.json API
  version: '1'
  summary: Holdings of 5,433 US ETFs, which ETFs hold a stock, and overlap, as static JSON.
  description: TickerInside is an open, machine-readable database of US ETF holdings, with the source and date of each holding.
  termsOfService: https://tickerinside.com/terms/
  contact:
    name: TickerInside
    email: contact@tickerinside.com
    url: https://tickerinside.com/api/
  license:
    name: CC BY 4.0
    identifier: CC-BY-4.0
servers:
- url: https://tickerinside.com/api/v1
  description: Static JSON files, and five answers computed from them when asked. No key.
security: []
tags:
- name: Manifest.json
paths:
  /manifest.json:
    get:
      operationId: getManifest
      summary: The manifest of a build
      description: 'Written last by every build: when it ran, the version of the API''s shape and of the calculations, each source with its version, date and age in days, and one sha256 for each family of files. The sha256 of every file under /api/v1/ is in /api/v1/sha256sums.txt.gz, in the format of sha256sum. Give built_at and calculation.version beside a figure to cite the exact state it comes from. The list holds every file under /api/v1/ but the manifest and the list. A family''s sha256 is the digest of its lines of the list, so it is the same on two nights whose files of that family did not change.'
      externalDocs:
        url: https://tickerinside.com/api/#manifest
      responses:
