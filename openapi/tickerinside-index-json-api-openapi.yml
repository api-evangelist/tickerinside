              type:
              - integer
              - 'null'
            stocks_with_weekly_series:
              type:
              - integer
              - 'null'
            pages:
              type: object
              properties:
                funds:
                  type:
                  - integer
                  - 'null'
                stocks:
                  type:
                  - integer
                  - 'null'
              additionalProperties: true
            issuers:
              type:
              - array
              - 'null'
              items:
                type:
                - 'null'
                - string
          additionalProperties: true
          description: 'The coverage counts. funds: the issuer-layer funds. securities_held: the distinct securities they hold. what: the universe in words. sec_nport: the SEC-layer funds, with the oldest and newest quarter end their filings describe in sec_nport_periods, and how old their holdings are on the day of the build in sec_nport_age (the 10th to the 90th percentile in whole months, low_months to high_months, and in words, text); sec_nport_bonds, sec_nport_multi_asset, sec_nport_derivatives, trust_filings, sponsor_files and prospectus, the other layers. Then the figures every page prints: funds_total, every layer, the US ETFs covered; universe, the coverage measured against the US-listed ETFs (see universe.json); stocks_with_file, the stocks with a file under /sec/, and stocks_with_weekly_series, those whose file carries the weekly series, at least 110 of the 156 weekly returns; pages, the funds and stocks with a page; issuers, the issuers whose files are read, largest first.'
