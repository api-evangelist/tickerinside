              properties:
                etfs:
                  type:
                  - number
                  - 'null'
                covered:
                  type:
                  - number
                  - 'null'
                pct:
                  type:
                  - number
                  - 'null'
                by_layer:
                  type: object
                  properties:
                    issuer_files:
                      type:
                      - number
                      - 'null'
                    sec_nport:
                      type:
                      - number
                      - 'null'
                    sec_nport_derivatives:
                      type:
                      - number
                      - 'null'
                    sec_nport_bonds:
