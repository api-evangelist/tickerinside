              type:
              - string
              - 'null'
            security:
              type:
              - string
              - 'null'
            holders:
              type:
              - string
              - 'null'
            holders_shard:
              type:
              - string
              - 'null'
            securities:
              type:
              - string
              - 'null'
            identifiers:
              type:
              - string
              - 'null'
            universe:
              type:
              - string
              - 'null'
            compare:
              type:
              - string
              - 'null'
            overlap:
              type:
              - string
              - 'null'
            lookthrough:
              type:
              - string
              - 'null'
            batch:
              type:
              - string
              - 'null'
            screen:
              type:
              - string
              - 'null'
            diversify:
              type:
              - string
              - 'null'
            ownership:
              type:
              - string
              - 'null'
            methods:
              type:
              - string
              - 'null'
            history:
              type:
              - string
              - 'null'
            fund_history:
              type:
              - string
              - 'null'
            status:
              type:
              - string
              - 'null'
            uptime:
              type:
              - string
              - 'null'
            manifest:
              type:
              - string
              - 'null'
            changelog:
              type:
              - string
              - 'null'
            deprecations:
              type:
              - string
              - 'null'
            corrections:
              type:
              - string
              - 'null'
            openapi:
              type:
              - string
              - 'null'
            docs_markdown:
              type:
              - string
              - 'null'
          additionalProperties: true
          description: The endpoints as URL templates, so a client can find them without reading the reference. fund answers for every fund; etf is the file of a fund listed under tickers_derivative, tickers_trust, tickers_bond, tickers_multi_asset, tickers_sponsor or tickers_prospectus. holders_shard is the template of the holders shards, {c} being the key's first character in lower case, a to z, or 0 for any other. It also gives the OpenAPI description (openapi), the reference in Markdown (docs_markdown), the nightly report (status) and the live checks (uptime).
        tickers:
          type:
          - array
          - 'null'
          items:
            type:
            - 'null'
            - string
          description: 'Every issuer-layer fund, as a sorted list: the funds read from their issuers'' own files. This is the universe the census of pairs and the file ages count over; a stock page counts these funds and the funds of tickers_sec.'
        tickers_sec:
          type:
          - array
          - 'null'
          items:
            type:
            - 'null'
            - string
          description: 'Every SEC-layer fund, as a sorted list: the other US stock ETFs, served from their latest SEC Form N-PORT filing. Each has a fund file like the funds above, dated to the quarter end its filing describes, and a page only in a published cohort.'
        tickers_derivative:
          type:
          - array
          - 'null'
          items:
            type:
            - 'null'
            - string
          description: Every derivative-based fund, sorted. Its file is under /etf/.
        tickers_trust:
          type:
          - array
          - 'null'
          items:
            type:
            - 'null'
            - string
          description: Every trust and commodity pool that files no Form N-PORT, sorted. Its file is under /etf/.
        tickers_bond:
          type:
          - array
          - 'null'
          items:
            type:
            - 'null'
            - string
          description: Every fixed income fund, sorted. Its file is under /etf/.
        tickers_multi_asset:
          type:
          - array
          - 'null'
          items:
            type:
            - 'null'
            - string
          description: Every multi-asset fund, sorted. Its file is under /etf/.
        tickers_sponsor:
          type:
          - array
          - 'null'
          items:
            type:
            - 'null'
            - string
          description: Every sponsor-file fund, sorted.
        tickers_prospectus:
          type:
          - array
          - 'null'
          items:
            type:
            - 'null'
            - string
          description: Every prospectus-file fund, sorted.
        written_comparisons:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              pair:
                type:
                - array
                - 'null'
                items:
                  type:
                  - 'null'
                  - string
              url:
                type:
                - string
                - 'null'
            additionalProperties: true
          description: 'The written comparisons: the pairs with a page written by hand, each with the URL of its JSON. A pair''s file exists only in the order listed here. Any two tickers above can still be compared from their two fund files.'
        without_file:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: The directory's tickers with no file, by the reason a fund address's 404 gives.
        docs:
          type:
          - string
          - 'null'
          description: The reference for these endpoints.
        license:
          type:
          - string
          - 'null'
          description: The licence the data is published under.
        attribution:
          type:
          - string
          - 'null'
          description: 'How to credit the data: a link to this file where the medium allows one, the name where it does not.'
        terms:
          type:
          - string
          - 'null'
          description: 'The legal notice: who publishes, the licence of the current snapshots served here, and the separate terms of the historical archive.'
