          description: 'No covered fund holds this key: a security they hold with no stock file answers 200 with coverage holders_only. An old key that now reads as keys with their market (7203) gets them in reads_as, from the aliases of holders, the shard of its first character. reason is_a_fund when the ticker is a covered fund (see fund).'
